<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفاحص الإداري | نسخة تجريبية</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#183047;background:#f5f8fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:740px;margin:auto;padding:20px}header{background:#123c49;color:white;padding:28px 20px;border-radius:0 0 22px 22px}h1{margin:0;font-size:27px}header p{margin:8px 0 0;color:#d4e8e9}.card{background:white;padding:24px;border-radius:18px;box-shadow:0 5px 24px #123c4910;margin:20px 0}h2{font-size:21px;margin-top:0}p{line-height:1.9}label{display:block;margin:12px 0;font-weight:600}textarea{width:100%;min-height:110px;border:1px solid #bed0d7;border-radius:12px;padding:13px;font:inherit;resize:vertical}.opt{display:block;width:100%;text-align:right;border:1px solid #c9d7de;border-radius:12px;background:#fff;padding:14px;margin:9px 0;font:inherit;cursor:pointer}.opt.selected{background:#e3f3f1;border:2px solid #187e77}button.primary{border:0;border-radius:12px;background:#116d69;color:white;padding:13px 23px;font:inherit;font-weight:700;cursor:pointer}button.secondary{border:1px solid #b4c9cd;border-radius:12px;background:white;padding:12px 18px;font:inherit;cursor:pointer;margin-inline-start:8px}button:disabled{opacity:.45;cursor:not-allowed}.muted{color:#5a6e7b;font-size:14px}.tag{display:inline-block;background:#e5f1f2;padding:5px 10px;border-radius:30px;color:#22545b;font-size:13px}.bar{height:7px;background:#e0eaed;border-radius:20px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#16847b;transition:width .2s}.report section{border-top:1px solid #e3e9ec;padding-top:14px;margin-top:15px}.report li{line-height:1.9}footer{text-align:center;color:#73838c;font-size:12px;padding:15px} @media print{header,.actions,.bar{display:none!important}.card{box-shadow:none}}</style></head><body><header><div class="wrap" style="padding:0"><h1>الفاحص الإداري</h1><p>لا توصية قبل التشخيص، ولا تشخيص دون أدلة</p></div></header><main class="wrap"><div class="card" id="app"></div><footer>نسخة استكشافية تجريبية — لا ترفع معلومات سرية أو بيانات مرضى</footer></main><script>
const hypotheses=[
{id:'H01',name:'تنظيم العلاقات بين الإدارات',keys:['تداخل','اختصاص','ادارات','إدارات','مسؤولية','مسؤوليات','تنسيق'],q:'عندما تشترك إدارتان في عمل، هل تُحدد الجهة القائدة والأدوار قبل البدء؟',opts:['نعم، بوضوح','أحيانًا','غالبًا لا','لا أعلم'],detail:['فحص عينة من الإجراءات المشتركة','مراجعة سياسات الإدارات ووثائق تحديد الأدوار'],rec:'دراسة توضيح الجهة المالكة للعمل والأدوار المساندة في الإجراءات المشتركة.'},
{id:'H02',name:'وضوح الصلاحيات والتفويض',keys:['صلاحيات','تفويض','اعتماد','تصعيد','قرار','قرارات','مركزية'],q:'هل توجد وثيقة محدثة تحدد مستويات الاعتماد والتفويض؟',opts:['نعم وتُطبق','نعم ولكن التطبيق متفاوت','لا توجد بوضوح','لا أعلم'],detail:['مراجعة وثائق التفويض والاعتماد','مقارنة مسارات قرارات متشابهة'],rec:'التحقق من الصلاحيات النظامية ثم مراجعة وضوح مستويات الاعتماد.'},
{id:'H03',name:'تكرار المراجعات',keys:['تكرار','مراجعة','موافقات','خطوات','اجراءات','إجراءات'],q:'هل تكرر مستويات مختلفة مراجعة المعلومات نفسها دون غرض رقابي مختلف؟',opts:['لا','في بعض الحالات','غالبًا','لا أعلم'],detail:['تتبع معاملة فعلية مرحلة بمرحلة','تحديد غرض كل مراجعة والضابط الذي تحققه'],rec:'فحص المراجعات المتشابهة مع الحفاظ على الموافقات النظامية الضرورية.'},
{id:'H04',name:'ثبات الإجراءات المؤسسية',keys:['مدير','قيادة','تغيير','تتغير','اجتهاد','عرف'],q:'هل يتغير مسار المعاملات المتشابهة بتغير المدير؟',opts:['لا','أحيانًا','بشكل ملحوظ','لا أعلم'],detail:['مقارنة الإجراءات قبل وبعد التغيير','مراجعة القرارات والتعاميم'],rec:'مراجعة توثيق مسارات العمل الداخلية واستقرارها عبر تغيّر القيادات.'},
{id:'H05',name:'اختناقات سير المعاملات',keys:['تأخر','تأخير','معاملات','انتظار','بطء','تعثر'],q:'هل توجد بيانات تحدد زمن العمل وزمن الانتظار لكل مرحلة؟',opts:['نعم','جزئيًا','لا','لا أعلم'],detail:['جمع تواريخ 10 معاملات متشابهة','تصنيف تعقيد المعاملات وحساسيتها'],rec:'قياس زمن التنفيذ والانتظار حسب نوع المعاملة قبل الحكم على التعثر.'},
{id:'H06',name:'توزيع القوى العاملة',keys:['موظفين','موظف','عبء','اعباء','أعباء','انتاجية','إنتاجية'],q:'هل يُراجع توزيع الموظفين مقابل حجم العمل الفعلي وجودته؟',opts:['بانتظام','أحيانًا','لا','لا أعلم'],detail:['مقارنة حجم العمل بالطاقة الاستيعابية','مراجعة الأوصاف الوظيفية'],rec:'دراسة ملاءمة توزيع الموارد للأعباء قبل اقتراح زيادة أو خفض القوى العاملة.'},
{id:'H07',name:'تكرار الأخطاء وإعادة العمل',keys:['أخطاء','خطأ','إعادة','نواقص','تدريب'],q:'هل تُسجل أسباب إعادة العمل والأخطاء المتكررة؟',opts:['نعم','جزئيًا','لا','لا أعلم'],detail:['تحليل عينات من الأعمال المعادة','التمييز بين قصور الإجراء والمهارات'],rec:'تحليل الأسباب الجذرية للأخطاء قبل تقرير الحاجة إلى التدريب.'},
{id:'H08',name:'مواءمة الخطط والموارد',keys:['خطة','خطط','مبادرة','مشروع','ميزانية','موارد','تخطيط'],q:'هل تُراجع الموارد والمدة المطلوبة قبل اعتماد المبادرات؟',opts:['نعم','أحيانًا','لا','لا أعلم'],detail:['مراجعة خطط المبادرات والاعتمادات','مقارنة الجدول المتوقع بالتنفيذ'],rec:'اختبار الربط بين اعتماد المبادرات والموارد والجداول الزمنية.'},
{id:'H09',name:'فاعلية مؤشرات الأداء',keys:['مؤشرات','أداء','قياس','نتائج','مستهدف'],q:'هل تُستخدم نتائج مؤشرات الأداء في قرارات التحسين الموثقة؟',opts:['نعم','أحيانًا','نادرا','لا أعلم'],detail:['مراجعة محاضر متابعة الأداء','فحص صلة المؤشرات بالجودة والأثر'],rec:'مراجعة كيفية استخدام المؤشرات في اتخاذ قرارات التحسين.'},
{id:'H10',name:'إغلاق الملاحظات الرقابية',keys:['رقابة','ملاحظات','تدقيق','تصحيح','تكرار'],q:'هل يُتحقق من عدم تكرار الملاحظة بعد إغلاق الإجراء التصحيحي؟',opts:['نعم','أحيانًا','لا','لا أعلم'],detail:['مراجعة سجل الملاحظات والإجراءات التصحيحية','التحقق من قياس الأثر بعد الإغلاق'],rec:'تعزيز التحقق من فاعلية الإجراءات التصحيحية لا مجرد إغلاقها إداريًا.'}
];
let stage='start',selected=-1,answers=[],picked=[],desc='';const el=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){if(stage==='start'){el.innerHTML='<span class="tag">نسخة تجريبية 1.0</span><h2>صف المشكلة أو المنشأة</h2><p>اكتب وصفًا مختصرًا. سيقترح الفاحص فرضيات ويطرح أسئلة تحقق قصيرة. النتائج استكشافية وليست تدقيقًا موثقًا.</p><label for="desc">وصف الحالة</label><textarea id="desc" placeholder="مثال: تتأخر المعاملات بين الإدارات وتتكرر الموافقات"></textarea><p class="muted">تعمل هذه النسخة داخل المتصفح دون إرسال إجاباتك إلى خادم. لا تستخدمها للبيانات الحساسة.</p><button class="primary" id="start">ابدأ الفحص</button>';document.getElementById('start').onclick=()=>{desc=document.getElementById('desc').value.trim();if(desc.length<8){alert('اكتب وصفًا من ثماني حروف على الأقل');return}const normalized=desc.toLowerCase();picked=hypotheses.map(h=>({...h,score:h.keys.filter(k=>normalized.includes(k)).length})).sort((a,b)=>b.score-a.score).slice(0,3);if(picked[0].score===0)picked=[hypotheses[0],hypotheses[4],hypotheses[8]];answers=[];stage='question';render()};return}if(stage==='question'){let i=answers.length,h=picked[i];selected=-1;el.innerHTML='<span class="tag">سؤال '+(i+1)+' من '+picked.length+'</span><div class="bar"><div class="fill" style="width:'+((i/picked.length)*100)+'%"></div></div><h2>'+esc(h.name)+'</h2><p>'+esc(h.q)+'</p><div id="options">'+h.opts.map((o,j)=>'<button class="opt" data-i="'+j+'">'+esc(o)+'</button>').join('')+'</div><div class="actions"><button class="primary" id="next" disabled>التالي</button><button class="secondary" id="back">رجوع</button></div>';el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);el.querySelectorAll('.opt').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{if(selected<0)return;answers.push(selected);stage=answers.length===picked.length?'report':'question';render()};document.getElementById('back').onclick=()=>{if(answers.length){answers.pop();render()}else{stage='start';render();document.getElementById('desc').value=desc}};return}let sections=picked.map((h,i)=>{let a=answers[i],uncertain=a===h.opts.length-1;return '<section><h3>'+esc(h.id+' — '+h.name)+'</h3><p><b>إفادة المستخدم:</b> '+esc(h.opts[a])+'</p><p><b>الحالة:</b> '+(uncertain?'المعلومة غير متاحة؛ لا يمكن الترجيح.':'مؤشر استكشافي قائم على الإفادة فقط؛ السبب لم يثبت.')+'</p><p><b>أدلة مطلوبة:</b> '+esc(h.detail.join('؛ '))+'</p><p><b>اتجاه الفحص:</b> '+esc(h.rec)+'</p></section>'}).join('');el.innerHTML='<div class="report"><span class="tag">تقرير استكشافي غير موثق</span><h2>نتيجة الفحص الأولي</h2><p><b>وصف الحالة:</b> '+esc(desc)+'</p><p>رشّح النموذج ثلاثة مجالات بناءً على كلمات الوصف، ثم طرح سؤال تحقق لكل مجال. لا تمثل النتائج إثباتًا لوجود خلل أو سببية أو خسارة مالية.</p>'+sections+'<section><h3>الخطوة التالية</h3><p>اختر معاملة أو عملية فعلية، واجمع مسارها المعتمد ومسارها الفعلي وتواريخ مراحلها، ثم تحقق من الفرضيات قبل أي توصية تنفيذية.</p></section></div><div class="actions"><button class="primary" id="print">طباعة / حفظ PDF</button><button class="secondary" id="restart">فحص جديد</button></div>';document.getElementById('print').onclick=()=>window.print();document.getElementById('restart').onclick=()=>{stage='start';render()}}
render();</script></body></html>
